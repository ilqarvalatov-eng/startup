<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xoş Gəldiniz | Start</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="theme-toggle">
        <button id="toggle-theme-btn" type="button" onclick="toggleTheme()">🌙 Qaranlıq Rejim</button>
    </div>

    <div class="hero-section">
        <div class="hero-content">
            <h1>Gələcəyin Platformasına <br><span>Xoş Gəldiniz</span></h1>
            <p>Müasir dizayn, sürətli interfeys və rahat istifadə. Davam etmək üçün seçim edin:</p>
            
            <div class="cta-buttons">
                <a href="registratin.html" class="btn register-btn">Qeydiyyatdan Keç</a>
                <a href="login.html" class="btn login-btn">Daxil Ol</a>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const btn = document.getElementById('toggle-theme-btn');
            if (document.body.classList.contains('dark-mode')) {
                btn.textContent = '☀️ Açıq Rejim';
            } else {
                btn.textContent = '🌙 Qaranlıq Rejim';
            }
        }
    </script>
</body>
</html>
