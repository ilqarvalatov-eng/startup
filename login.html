<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daxil Ol</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="theme-toggle">
        <button id="toggle-theme-btn" type="button">🌙 Qaranlıq Rejim</button>
    </div>

    <div class="form-container">
        <h2>Daxil Ol</h2>
        <p>Hesabınıza daxil olmaq üçün məlumatları daxil edin</p>

        <form id="login-form">
            
            <div class="input-group">
                <label for="login-email">E-poçt Ünvanı</label>
                <input type="email" id="login-email" placeholder="nümunə@mail.com" required>
            </div>

            <div class="input-group password-group">
                <label for="login-password">Şifrə</label>
                <div class="password-wrapper">
                    <input type="password" id="login-password" placeholder="••••••••" required>
                    <span id="toggle-password" class="eye-btn" style="cursor: pointer;">👁️</span>
                </div>
            </div>

            <button type="submit" class="submit-btn">Daxil Ol</button>

            <p class="form-footer">
                Hesabınız yoxdur? <a href="registratin.html">Qeydiyyatdan keçin</a>
            </p>

        </form>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
